<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读器</title>
    <style>
        #toolbar {
            background-color: #333;
            color: white;
            text-align: center;
            width: 100%;
            padding: 10px;
            top: 0;
            position: fixed;
            z-index: 100;
        }

        .toolbar-button {
            background-color: #555;
            font-size: 16px;
            color: white;
            border: 5px none;
            padding: 10px 20px;
            cursor: pointer;
        }

        #reader {
            margin-top: 60px;
            margin-bottom: 60px;
            margin-left: auto;
            margin-right: auto;
            border: 2px solid #ccc;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            height: 2000px;
            position: relative;
        }

        .text-content {
            font-size: 18px;
            line-height: 1.6;
            text-align: justify;
            margin-bottom: 20px;
            color: #333;
            text-indent: 2em;
            text-decoration: none;
        }
        h2{
            line-height: 2;
        }

        #note-container {
            width: 300px;
            height: 200px;
            background-color: #ffffff;
            border: 2px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 10px;
            position: fixed;
            top: 65%;
            right: 3%;
        }

        p {
            margin-top: 10px;
            margin-bottom: 10px;
            margin-left: 0;
            margin-right: 0;
            text-align: left;
            color: #222;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial,sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- 工具栏 -->
    <div id="toolbar">
        <button class="toolbar-button">放大</button>
        <button class="toolbar-button">缩小</button>
        <button class="toolbar-button">切换主题</button>
    </div>

    <!-- 阅读区域 -->
    <div id="reader">
        <h2>文章标题</h2>
        <p class="text-content">这是一段文本内容，旨在展示阅读器区域中的文本样式和布局效果。</p>
        <p class="text-content">阅读区域可以展示多个段落，提供更好的阅读体验。</p>
    </div>

    <!-- 笔记区域 -->
    <div id="note-container">
        <h3>笔记</h3>
        <p>这里是笔记内容，可以记录阅读过程中重要的事项。</p>
    </div>
</body>

</html>
