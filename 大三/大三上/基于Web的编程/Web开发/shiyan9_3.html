<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <script>
        // codeing here
        function isEven(num) {
            if (num % 2 == 0) {
                return true;
            } else {
                return false;
            }
        }
        function square(num) {
            return num * num;
        }

        // 生成数组
        var numbers = [];
        for (var i = 1; i <= 10; i++) {
            numbers.push(i);
        }

        var evenSquares = numbers.filter(isEven).map(square)
        console.log(evenSquares);

        totalSum = evenSquares.reduce(function (sum, element) {
            return sum + element;
        }, 0);
        console.log("Total even squares sum:", totalSum);

    </script>
</body>

</html>
